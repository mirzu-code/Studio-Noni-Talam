<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuih Mascot</title>
<style>
:root{--bg:#f3ecd6;--card:#fffaf0;--ink:#2b3a1f;--btn:#4f9a2a;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d2417;--card:#27311f;--ink:#e6efd8;--btn:#7bc74d;--btnink:#12200a}}
:root[data-theme="dark"]{--bg:#1d2417;--card:#27311f;--ink:#e6efd8;--btn:#7bc74d;--btnink:#12200a}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.stage{width:min(92vw,380px);height:min(62vh,440px);background:var(--card);border-radius:24px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.15)}
#c{width:100%;height:100%;display:block}
.ui{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 12px}
button{font:inherit;font-size:15px;border:0;border-radius:10px;padding:9px 14px;background:var(--btn);color:var(--btnink);cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.25)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button:focus-visible{outline:3px solid var(--ink)}
small{opacity:.7;font-size:12px;text-align:center;padding:0 16px}
body.bare{background:transparent;gap:0}
body.bare .stage{width:100vw;height:100vh;border-radius:0;background:transparent;box-shadow:none}
body.bare .ui,body.bare small{display:none}
</style></head><body>
<div class="stage"><canvas id="c"></canvas></div>
<div class="ui"><button data-m="wave">Wave</button><button data-m="dance">Dance</button><button data-m="cute">Cute</button><button data-m="talk">Talk</button><button data-m="think">Think</button><button data-m="auto">Auto</button></div>
<small>Chatbox: embed with ?bare=1 and call kuih.play('talk', 3)</small>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
if(new URLSearchParams(location.search).has('bare'))document.body.classList.add('bare');
const cv=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.setClearColor(0,0);R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const S=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(34,1,.1,100);
S.add(new THREE.HemisphereLight(0xfff6e0,0x7a8a5a,.85));
const dl=new THREE.DirectionalLight(0xffffff,.8);dl.position.set(3,7,5);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);
Object.assign(dl.shadow.camera,{left:-4,right:4,top:5,bottom:-4,near:1,far:20});dl.shadow.bias=-.0005;S.add(dl);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(12,12),new THREE.ShadowMaterial({opacity:.2}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;S.add(ground);

const M=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:0});
const rb=(w,h,d,sg=8,rf=.15)=>{const r=Math.min(w,h,d)*rf,g=new THREE.BoxGeometry(w,h,d,sg,sg,sg),p=g.attributes.position,n=g.attributes.normal,v=V3(0,0,0),c=V3(0,0,0),hx=w/2-r,hy=h/2-r,hz=d/2-r;
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);c.set(Math.max(-hx,Math.min(hx,v.x)),Math.max(-hy,Math.min(hy,v.y)),Math.max(-hz,Math.min(hz,v.z)));v.sub(c).normalize();n.setXYZ(i,v.x,v.y,v.z);p.setXYZ(i,c.x+v.x*r,c.y+v.y*r,c.z+v.z*r)}return g};
const add=(o,x,y,z,p)=>{o.position.set(x,y,z);o.castShadow=true;(p||S).add(o);return o};
const box=(w,h,d,m,x,y,z,p)=>add(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m),x,y,z,p);
const sph=(r,m,x,y,z,p,sx=1,sy=1,sz=1)=>{const o=add(new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m),x,y,z,p);o.scale.set(sx,sy,sz);return o};
const cap=(r,l,m,x,y,z,p)=>add(new THREE.Mesh(new THREE.CapsuleGeometry(r,l,6,12),m),x,y,z,p);
const dark=M(0x2a2a2a,.4),W=M(0xffffff,.3),pinkT=M(0xf08090,.5),cheek=M(0xf4a0a0,.8),limb=M(0x4f9a2a),hand=M(0xf6dcc0),foot=M(0x3d8a22),hm=M(0xff5a86,.4),starM=M(0xffd84a,.3);

const ch=new THREE.Group();S.add(ch);const body=new THREE.Group();ch.add(body);
add(new THREE.Mesh(rb(2.2,1.0,1.9,16,.26),M(0x68b83a,.7)),0,1.0,0,body);
add(new THREE.Mesh(rb(2.2,.8,1.9,16,.3),M(0xf4efdb,.7)),0,1.9,0,body);

function heart(s){const g=new THREE.Group(),a=1.2*s;const b=new THREE.Mesh(new THREE.BoxGeometry(1,1,.4),hm);b.rotation.z=Math.PI/4;b.scale.set(a,a,1);g.add(b);
 [-1,1].forEach(k=>{const c=new THREE.Mesh(new THREE.SphereGeometry(.6*s,12,10),hm);c.position.set(k*.424*s,.424*s,0);c.scale.z=.4;g.add(c)});return g}
// face
const f=new THREE.Group();body.add(f);
function eye(x){const g=new THREE.Group();g.position.set(x,1.12,.97);f.add(g);
 const op=new THREE.Group();g.add(op);sph(.12,dark,0,0,0,op,1,1.35,.4);sph(.045,W,-.03,.07,.05,op);sph(.025,W,.04,-.04,.05,op);
 const ca=new THREE.Group();g.add(ca);[[-.07,.6],[.07,-.6]].forEach(([px,rz])=>{const b=box(.17,.045,.03,dark,px,0,0,ca);b.rotation.z=rz});
 const he=heart(.11);he.position.y=-.03;g.add(he);return {op,ca,he}}
const eyes=[eye(-.5),eye(.5)];
const chL=sph(.11,cheek,-.7,.92,.93,f,1,.65,.3),chR=sph(.11,cheek,.7,.92,.93,f,1,.65,.3);
const mg=new THREE.Group();mg.position.set(0,.93,.97);f.add(mg);
const mSmile=add(new THREE.Mesh(new THREE.TorusGeometry(.12,.028,8,16,Math.PI),dark),0,0,0,mg);mSmile.rotation.z=Math.PI;
const mOpen=new THREE.Group();mg.add(mOpen);sph(.15,dark,0,-.04,0,mOpen,1,.8,.35);sph(.07,pinkT,0,-.1,.03,mOpen,1,.6,.3);
const mO=sph(.055,dark,0,-.05,0,mg,1,1.2,.4),mTongue=sph(.05,pinkT,.06,-.17,.01,mg,1,1.3,.4);
function setFace(e,m){eyes.forEach((E,i)=>{E.op.visible=e==='open'||e==='up'||(e==='wink'&&i===1);E.ca.visible=e==='caret'||(e==='wink'&&i===0);E.he.visible=e==='heart';E.op.position.y=e==='up'?.07:0});
 mSmile.visible=m==='smile'||m==='tongue';mTongue.visible=m==='tongue';mOpen.visible=m==='open';mO.visible=m==='o'}
// limbs
const armL=new THREE.Group();armL.position.set(-1.15,1.15,0);body.add(armL);cap(.1,.45,limb,0,-.35,0,armL);sph(.16,hand,0,-.76,0,armL);
const armR=new THREE.Group();armR.position.set(1.15,1.15,0);body.add(armR);cap(.1,.45,limb,0,-.35,0,armR);sph(.16,hand,0,-.76,0,armR);
const legL=new THREE.Group(),legR=new THREE.Group();
[[legL,-.55],[legR,.55]].forEach(([g,x])=>{g.position.set(x,.58,.1);ch.add(g);cap(.11,.2,limb,0,-.21,0,g);sph(.16,foot,0,-.47,.08,g,1,.6,1.4)});
// thinking dots
const dots=[0,1,2].map(i=>sph(.1,dark,-.35+i*.35,3.2,0.2));
// fx
const fx=[];
function fxHeart(){const g=heart(.12+Math.random()*.06);g.position.set((Math.random()-.5)*1.8,2.7,.7);S.add(g);fx.push({g,t:0,vx:(Math.random()-.5)*.5,life:1.6,sp:0})}
function fxStar(){const g=new THREE.Group();[0,Math.PI/2].forEach(r=>{const b=new THREE.Mesh(new THREE.BoxGeometry(.28,.06,.04),starM);b.rotation.z=r;g.add(b)});g.position.set((Math.random()-.5)*3.2,1+Math.random()*2,.9);S.add(g);fx.push({g,t:0,vx:0,life:1,sp:4})}

// state
const SEQ=[['wave',3.4],['cute',3.8],['dance',9],['cute',3],['idle',2]];
let T=0,si=0,st=0,ovr=null,autoOn=true,pop=0,hopK=0,yaw=0,rz=0,aR=.3,aL=-.3,lastIdx=-1,lastBeat=-1;
const A={wave:0,dance:0,cute:0,talk:0,think:0},look={x:0};
function curMode(){if(ovr&&T<ovr.u)return ovr.m;ovr=null;if(!autoOn)return 'idle';if(T-st>SEQ[si][1]){si=(si+1)%SEQ.length;st=T}return SEQ[si][0]}
window.kuih={play(m,s=3){ovr={m,u:T+s}},set(m){ovr={m,u:1e9}},stop(){ovr=null;autoOn=true},auto(v){autoOn=!!v}};
addEventListener('message',e=>{const d=e.data;if(d&&typeof d.kuih==='string')d.kuih==='auto'?kuih.stop():kuih.play(d.kuih,+d.seconds||3)});
addEventListener('pointermove',e=>look.x=(e.clientX/innerWidth-.5)*2);
cv.addEventListener('pointerdown',()=>{kuih.play('cute',2.6);hopK=.45});
document.querySelectorAll('button[data-m]').forEach(b=>b.onclick=()=>b.dataset.m==='auto'?kuih.stop():kuih.play(b.dataset.m,4));

function size(){const w=cv.clientWidth||300,h=cv.clientHeight||300;R.setSize(w,h,false);cam.aspect=w/h;
 const d=8.2*(w/h<.85?.85/(w/h):1);cam.position.set(0,2.2,d);cam.lookAt(0,1.45,0);cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(cv);size();
const clk=new THREE.Clock(),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,PI=Math.PI;
(function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05);T+=dt;
 const mode=curMode(),k6=Math.min(1,dt*6);
 for(const k in A)A[k]+=((mode===k?1:0)-A[k])*k6;
 const b=T*2,sb=Math.sin(PI*b),ab=Math.abs(sb),mv=Math.floor(T/3)%3;
 // dance moves
 let dR=0,dL=0,dZ=0,spin=false;
 if(mv===0){dR=sb>0?2:0;dL=sb<0?2:0}
 else if(mv===1){dR=2+.3*Math.sin(2*PI*b);dL=2+.3*Math.sin(2*PI*b+PI);dZ=sb*.18}
 else{dR=1.2;dL=1.2;spin=A.dance>.5}
 const tR=.3+A.wave*(1.75+.35*Math.sin(T*11))+A.dance*dR+A.cute*(.6+.25*Math.sin(T*3))+A.talk*(.15+.3*Math.sin(T*2.7))+A.think*.5;
 const tL=-(.3+A.dance*dL+A.cute*(.6+.25*Math.sin(T*3+1.5))+A.talk*(.15+.3*Math.sin(T*2.2+1))+A.think*.1)+Math.sin(T*2.4)*.05;
 const k12=Math.min(1,dt*12);aR+=(tR-aR)*k12;aL+=(tL-aL)*k12;armR.rotation.z=aR;armL.rotation.z=aL;
 const tz=Math.sin(T*1.2)*.03+A.cute*.14*Math.sin(T*2)+A.think*.16+A.dance*dZ;rz+=(tz-rz)*k12;ch.rotation.z=rz;
 if(spin)yaw+=dt*4.2;else{yaw=((yaw+PI)%(2*PI)+2*PI)%(2*PI)-PI;const ty=A.dance>.5?Math.sin(PI*b*.5)*.35:look.x*.45;yaw+=(ty-yaw)*Math.min(1,dt*6)}
 ch.rotation.y=yaw;
 hopK=Math.max(0,hopK-dt);
 if(pop<1)pop=Math.min(1,pop+dt/.8);ch.scale.setScalar(Math.max(.001,1-Math.exp(-5*pop)*Math.cos(9*pop)));
 ch.position.y=(reduce?0:Math.sin(T*2.5)*.03)+A.dance*ab*.3+A.cute*Math.abs(Math.sin(T*3))*.15+A.wave*Math.abs(Math.sin(T*5))*.08+A.talk*Math.abs(Math.sin(T*7))*.04+Math.sin(Math.min(hopK,.45)/.45*PI)*.4*(hopK>0?1:0);
 const sc=1-(.06*Math.cos(2*PI*b)*A.dance+.03*Math.sin(T*2.2));body.scale.set(1+(1-sc)*.5,sc,1+(1-sc)*.5);body.position.y=.5*(1-sc);
 const lg=Math.sin(T*2.5)*.06+A.dance*Math.sin(2*PI*b)*.5+A.cute*Math.sin(T*6)*.2;legL.rotation.x=lg;legR.rotation.x=-lg;
 // face
 let e='open',m='smile';
 if(mode==='wave')m='open';
 else if(mode==='cute'){const i=Math.floor(T*1.1)%4;[e,m]=[['heart','smile'],['wink','tongue'],['caret','open'],['open','o']][i];
  if(i!==lastIdx){lastIdx=i;if(i===0||i===3)for(let n=0;n<3;n++)fxHeart()}}
 else if(mode==='dance'){e=Math.floor(b/4)%2?'open':'caret';m='open'}
 else if(mode==='talk')m=Math.sin(T*12)+Math.sin(T*7.3)>.2?'open':'smile';
 else if(mode==='think'){e='up';m='o'}
 if(mode!=='cute')lastIdx=-1;
 if(mode==='dance'&&Math.floor(b)!==lastBeat){lastBeat=Math.floor(b);fxStar()}
 setFace(e,m);const bl=(T%3.3)<.12?.1:1;eyes.forEach(E=>E.op.scale.y=bl);
 const pc=1+.1*Math.sin(T*3)+A.cute*.3;chL.scale.set(pc,.65*pc,.3);chR.scale.set(pc,.65*pc,.3);
 dots.forEach((d,i)=>{d.visible=A.think>.3;d.scale.setScalar(.6+.5*Math.max(0,Math.sin(T*5-i*.9)));d.position.y=3.2+.08*Math.sin(T*5-i*.9)});
 for(let i=fx.length-1;i>=0;i--){const o=fx[i];o.t+=dt;o.g.position.y+=dt*.8;o.g.position.x+=o.vx*dt;o.g.rotation.z+=o.sp*dt;o.g.scale.setScalar(Math.max(.001,Math.sin(PI*Math.min(1,o.t/o.life))));if(o.t>o.life){S.remove(o.g);fx.splice(i,1)}}
 R.render(S,cam)})();
</script></body></html>
